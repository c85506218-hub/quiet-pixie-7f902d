<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>臺南市消防分隊服務人口地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 主題色票（深色為預設，淺色以 data-theme="light" 覆寫）────────────── */
:root{
  --bg:#111827;
  --hdr-bg:#0f1923; --hdr-border:#1e3a52;
  --h1:#e2f0ff; --sub:#4a7a9b; --leg:#7a9ab4;
  --panel-bg:#0d1b2a; --panel-hdr-bg:#0a1520; --panel-border:#1e3a52;
  --p-dist:#deeeff; --p-brig:#3d7fa8;
  --scroll:#1e3a52;
  --summ-bg:#0a1d30; --summ-line:#0f2233; --sk:#3d7fa8; --sv:#c8dff0;
  --card-bg:#0a1d30; --card-border:#1a3348; --uname:#b8d4ec;
  --lbl:#2d5a7a; --bar-bg:#0f2a3d;
  --val-blue:#64b5f6; --val-teal:#80cbc4;
  --note-bg:#1a3040; --note-fg:#5a8aaa;
  --btn-bg:rgba(10,21,32,.9); --btn-border:#1e3a52; --btn-fg:#7a9ab4;
  --btn-on-bg:#1e3a52; --btn-on-fg:#e2f0ff;
  --hint-bg:rgba(10,21,32,.92); --hint-border:#1e3a52; --hint-fg:#7a9ab4;
  --tt-bg:rgba(8,18,28,.96); --tt-border:#1e3a52; --tt-fg:#c8dff0;
  --tt-name:#deeeff; --tt-sub:#5a8aaa; --tt-shadow:0 4px 16px rgba(0,0,0,.5);
  --dist-fg:#fff;
  --dist-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000,0 -1px 2px #000;
  --brig-pill:rgba(0,0,0,.55);
  --empty:#3d6a8a;
  --panel-shadow:-8px 0 32px rgba(0,0,0,.5);
  --poly-stroke:#0a1520; --poly-hover:#64b5f6; --poly-active:#90caf9;
  --fill-op:.6; --fill-op-hover:.82; --fill-op-active:.88;
  --ebar-bg:rgba(60,42,10,.95); --ebar-bd:#7a5a18; --ebar-fg:#f0d9a0; --ebar-hi:#ffc94d;
  --sinput-bg:#0a1d30;
}
:root[data-theme="light"]{
  --bg:#f4f0e6;
  --hdr-bg:#fffdf7; --hdr-border:#ddd3c0;
  --h1:#1f2a37; --sub:#8a7c63; --leg:#5c6673;
  --panel-bg:#fffdf7; --panel-hdr-bg:#f7f2e6; --panel-border:#ddd3c0;
  --p-dist:#1f2a37; --p-brig:#6b7684;
  --scroll:#cfc4ae;
  --summ-bg:#f7f2e6; --summ-line:#e6ddc9; --sk:#7d8794; --sv:#2b3644;
  --card-bg:#fffaf0; --card-border:#e2d9c6; --uname:#2b3644;
  --lbl:#9a917f; --bar-bg:#e8e0cd;
  --val-blue:#1565c0; --val-teal:#00695c;
  --note-bg:#efe7d5; --note-fg:#7a6f5c;
  --btn-bg:rgba(255,253,247,.94); --btn-border:#ddd3c0; --btn-fg:#5c6673;
  --btn-on-bg:#2b3644; --btn-on-fg:#fffdf7;
  --hint-bg:rgba(255,253,247,.94); --hint-border:#ddd3c0; --hint-fg:#5c6673;
  --tt-bg:rgba(255,253,247,.97); --tt-border:#ddd3c0; --tt-fg:#3d4a5a;
  --tt-name:#1f2a37; --tt-sub:#8a8271; --tt-shadow:0 4px 16px rgba(60,50,30,.18);
  --dist-fg:#1f2a37;
  --dist-shadow:0 0 3px #fffdf7,0 0 6px #fffdf7,0 1px 2px #fffdf7,0 -1px 2px #fffdf7;
  --brig-pill:rgba(31,42,55,.82);
  --empty:#9a917f;
  --panel-shadow:-8px 0 32px rgba(60,50,30,.16);
  --poly-stroke:#fffdf7; --poly-hover:#1565c0; --poly-active:#0d47a1;
  --fill-op:.62; --fill-op-hover:.8; --fill-op-active:.86;
  --ebar-bg:rgba(255,244,214,.97); --ebar-bd:#d6b978; --ebar-fg:#6b5320; --ebar-hi:#a5720c;
  --sinput-bg:#fffdf7;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);height:100vh;
  display:flex;flex-direction:column;overflow:hidden}

.hdr{background:var(--hdr-bg);border-bottom:1px solid var(--hdr-border);padding:9px 16px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:999}
.hdr h1{font-size:14px;font-weight:700;color:var(--h1)}
.hdr p{font-size:10px;color:var(--sub);margin-top:1px}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--leg);white-space:nowrap}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}

#map{flex:1;background:var(--bg)}

/* district name labels */
.dist-label{
  background:transparent!important;border:none!important;box-shadow:none!important;
  font-family:'Noto Sans TC',sans-serif;
  pointer-events:none;
}
.dist-label-inner{
  font-size:11px;font-weight:700;
  color:var(--dist-fg);
  text-shadow:var(--dist-shadow);
  white-space:nowrap;text-align:center;
}

/* brigade name labels */
.brig-label{
  background:transparent!important;border:none!important;box-shadow:none!important;
  font-family:'Noto Sans TC',sans-serif;
  pointer-events:none;
}
.brig-label-inner{
  font-size:12px;font-weight:700;
  white-space:nowrap;text-align:center;
  padding:2px 6px;border-radius:4px;
  background:var(--brig-pill);
}

/* Panel — slides from right on desktop, bottom on mobile */
.panel{
  position:fixed;right:0;top:0;bottom:0;width:300px;
  background:var(--panel-bg);border-left:1px solid var(--panel-border);
  display:flex;flex-direction:column;
  transform:translateX(102%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:1200;box-shadow:var(--panel-shadow);
}
.panel.open{transform:translateX(0)}

.p-hdr{padding:13px 14px 9px;border-bottom:1px solid var(--panel-border);
  background:var(--panel-hdr-bg);flex-shrink:0;position:relative}
.p-dist{font-size:16px;font-weight:700;color:var(--p-dist);padding-right:28px}
.p-brig{font-size:11px;color:var(--p-brig);margin-top:2px}
.p-close{position:absolute;right:10px;top:10px;background:none;border:1px solid var(--panel-border);
  color:var(--sub);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.p-close:hover{background:var(--btn-on-bg);color:var(--btn-on-fg)}

.p-body{overflow-y:auto;padding:11px;flex:1}
.p-body::-webkit-scrollbar{width:3px}
.p-body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:2px}

.summ{background:var(--summ-bg);border:1px solid var(--panel-border);border-radius:8px;padding:9px 12px;margin-bottom:9px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.srow+.srow{border-top:1px solid var(--summ-line)}
.sk{font-size:11px;color:var(--sk)}
.sv{font-size:12px;font-weight:500;color:var(--sv)}

.ucard{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.ucard:last-child{margin-bottom:0}
.uname{font-size:12px;font-weight:500;color:var(--uname);margin-bottom:6px;line-height:1.4}
.ubadge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;font-weight:500}
:root[data-theme="light"] .ubadge.brig{filter:brightness(.72) saturate(1.35)}
.u3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;text-align:center}
.u3 .val{font-size:14px;font-weight:700}
.u3 .lbl{font-size:9px;color:var(--lbl);margin-top:1px}
.xnote{font-size:9px;color:var(--lbl);margin-top:5px;line-height:1.5}

/* 試算模式 */
.ebar{display:none;flex-shrink:0;z-index:950;
  background:var(--ebar-bg);border-bottom:1px solid var(--ebar-bd);
  padding:7px 14px;font-size:11px;color:var(--ebar-fg);
  align-items:center;gap:10px;flex-wrap:wrap}
.ebar.show{display:flex}
.ebar b{color:var(--ebar-hi)}
.ebar button{background:var(--btn-bg);border:1px solid var(--ebar-bd);color:var(--ebar-fg);
  border-radius:6px;padding:3px 9px;font-size:10px;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:all .15s}
.ebar button:hover{background:var(--btn-on-bg);color:var(--btn-on-fg)}
.sinput{width:56px;text-align:center;font-size:14px;font-weight:700;
  font-family:'Noto Sans TC',sans-serif;
  background:var(--sinput-bg);color:var(--val-blue);
  border:1px solid var(--ebar-bd);border-radius:5px;padding:1px 2px}
.sinput:focus{outline:none;border-color:var(--val-blue)}
.uedit{outline:1px dashed var(--ebar-hi);outline-offset:1px}

/* 全部分隊清單 */
.panel.wide{width:392px}
.ahdr,.arow{display:grid;grid-template-columns:1fr 50px 60px 54px;gap:6px;align-items:center}
.ahdr{padding:0 6px 5px;font-size:9px;color:var(--lbl);text-align:right;
  border-bottom:1px solid var(--panel-border)}
.ahdr span:first-child{text-align:left}
.arow{padding:4px 6px;border-bottom:1px solid var(--summ-line);border-radius:5px}
.arow:hover{background:var(--summ-bg)}
.an{font-size:11px;color:var(--uname);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an small{color:var(--lbl);font-size:9px;margin-left:3px}
.ap{font-size:10px;color:var(--val-teal);text-align:right}
.ar{font-size:11px;font-weight:700;text-align:right}
.sinput.sm{width:100%;font-size:12px;padding:2px 0}
.ghdr{display:flex;justify-content:space-between;align-items:baseline;
  margin:12px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--panel-border)}
.gname{font-size:12px;font-weight:700}
:root[data-theme="light"] .gname{filter:brightness(.72) saturate(1.35)}
.gsum{font-size:9px;color:var(--lbl)}
.bw{margin-top:7px}
.bl{display:flex;justify-content:space-between;font-size:9px;color:var(--lbl);margin-bottom:3px}
.bb{height:5px;background:var(--bar-bg);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px}

.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--hint-bg);border:1px solid var(--hint-border);border-radius:20px;
  padding:6px 15px;font-size:11px;color:var(--hint-fg);pointer-events:none;
  white-space:nowrap;z-index:900;transition:opacity .3s}
.hint.hidden{opacity:0}

/* Leaflet tooltip */
.leaflet-tooltip{
  background:var(--tt-bg)!important;border:1px solid var(--tt-border)!important;
  border-radius:7px!important;color:var(--tt-fg)!important;
  font-family:'Noto Sans TC',sans-serif!important;font-size:11px!important;
  padding:6px 10px!important;box-shadow:var(--tt-shadow)!important;pointer-events:none}
.tt-n{font-size:13px;font-weight:700;color:var(--tt-name);margin-bottom:2px}
.tt-s{color:var(--tt-sub);font-size:10px;margin-top:2px}

/* toggle buttons */
.map-ctrl{position:absolute;bottom:20px;right:16px;z-index:800;display:flex;flex-direction:column;gap:6px}
.ctrl-btn{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--btn-fg);
  border-radius:8px;padding:6px 11px;font-size:11px;cursor:pointer;
  font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:all .15s}
.ctrl-btn:hover,.ctrl-btn.on{background:var(--btn-on-bg);color:var(--btn-on-fg)}
#btn-theme:hover{background:var(--btn-on-bg);color:var(--btn-on-fg)}

@media(max-width:640px){
  .panel{width:100%;top:auto;right:0;bottom:0;height:58vh;border-left:none;
    border-top:1px solid var(--panel-border);transform:translateY(102%)}
  .panel.open{transform:translateY(0)}
  .legend{display:none}
  .map-ctrl{bottom:16px;right:10px}
}
</style>
<script>
/* 在渲染前決定主題，避免深/淺切換時閃爍 */
(function(){
  var t=null;
  try{t=localStorage.getItem('fdmap-theme');}catch(e){}
  if(t!=='light'&&t!=='dark'){
    t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
</head>

<div class="hdr">

<div class="map-ctrl">

  <button class="ctrl-btn on" id="btn-label" onclick="toggleLabels()">📍 區名</button>

    <button class="p-close" onclick="closePanel()">✕</button>
  </div>
  <div class="p-body" id="pd-body"></div>
</div>

// 該區投入人力：跨行政區的分隊，按本區人口占全隊服務人口的比例折算
function effStaff(d){
  return (FD[d]||[]).reduce((s,u)=>s+(u.total>0?gs(u)*u.pop/u.total:0),0);
}

// 該區服務人口比 = 區人口 ÷ 折算人力
function avgRatio(d){
  const us=FD[d]||[];
  const pop=us.reduce((s,u)=>s+(u.total>0?u.pop:0),0);
  const st=effStaff(d);
  return st>0?pop/st:0;
}

function fmtStaff(s){return Math.abs(s-Math.round(s))<0.05?String(Math.round(s)):s.toFixed(1);}
// ── Theme ─────────────────────────────────────────────────────────────
let theme=document.documentElement.getAttribute('data-theme')||'dark';
let currentDist=null;
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

// 級距 0=無資料 1=<1500 2=1500-2500 3=2500-3500 4=>3500
function ratioIdx(r){
  if(r<=0)return 0;
  if(r<1500)return 1;
  if(r<2500)return 2;
  if(r<3500)return 3;
  return 4;
}
const RATIO_FILL=['#546e7a','#2ecc71','#f1c40f','#e67e22','#e74c3c'];
// 淺色底需要較深的文字色才有對比
const RATIO_TEXT_LIGHT=['#5b6b76','#1e8449','#96700a','#b1541a','#c0392b'];
function ratioColor(r){return RATIO_FILL[ratioIdx(r)];}
function ratioText(r){return (theme==='light'?RATIO_TEXT_LIGHT:RATIO_FILL)[ratioIdx(r)];}

function tipHTML(name){
  const r=avgRatio(name);
  const units=FD[name]||[];
  const cnt=units.filter(u=>u.total>0).length;
  return `<div class="tt-n">${name}</div>
    ${r>0?`<div style="color:${ratioText(r)};font-weight:700">服務人口比 ${Math.round(r).toLocaleString()} 人/員</div>`:''}
    <div class="tt-s">分隊 ${cnt} 隊 ｜ 投入人力 ${fmtStaff(effStaff(name))} 人</div>`;
}

// ── Map ──────────────────────────────────────────────────────────────
const map=L.map('map',{center:[23.08,120.22],zoom:10,zoomControl:true});
const TILE_OPT={attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19};
const TILES={
  dark :L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',TILE_OPT),
  light:L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',TILE_OPT)
};
TILES[theme].addTo(map);

// ── District fill layer ───────────────────────────────────────────────
let activeLayer=null;

const distGeo=L.geoJSON(GJ,{
  style(f){
    const r=avgRatio(f.properties.name);
    return{fillColor:ratioColor(r),fillOpacity:+cssv('--fill-op'),color:cssv('--poly-stroke'),weight:1};
  },
  onEachFeature(feature,layer){
    const name=feature.properties.name;
    layer.bindTooltip(tipHTML(name),{sticky:true,offset:[10,0]});
    layer.on({
      mouseover(e){if(activeLayer!==e.target)e.target.setStyle({weight:2.5,color:cssv('--poly-hover'),fillOpacity:+cssv('--fill-op-hover')});e.target.bringToFront();},
      mouseout(e){if(activeLayer!==e.target)distGeo.resetStyle(e.target);},
      click(e){
        if(activeLayer&&activeLayer!==e.target)distGeo.resetStyle(activeLayer);
        activeLayer=e.target;
        e.target.setStyle({weight:3,color:cssv('--poly-active'),fillOpacity:+cssv('--fill-op-active')});
        document.getElementById('hint').classList.add('hidden');
        openPanel(name);
      }
    });
  }
}).addTo(map);

// ── Brigade outline layer ─────────────────────────────────────────────
const brigGeo=L.geoJSON(BJ,{
  style(f){
    const color=f.properties.color;
    return{fill:false,color:color,weight:3.5,opacity:.9,dashArray:'6 4'};
  },
  onEachFeature(f,layer){layer.bringToFront();}
}).addTo(map);

// ── District name labels ──────────────────────────────────────────────
const labelLayer=L.layerGroup();
for(const [name,[lng,lat]] of Object.entries(CE)){
  const r=avgRatio(name);
  // adjust font size by zoom (fixed at creation, toggle visibility)
  const icon=L.divIcon({
    className:'dist-label',
    html:`<div class="dist-label-inner">${name.replace('區','')}</div>`,
    iconAnchor:[20,8],iconSize:[40,16]
  });
  L.marker([lat,lng],{icon,interactive:false,zIndexOffset:500}).addTo(labelLayer);
}
labelLayer.addTo(map);

// ── Brigade name labels ───────────────────────────────────────────────
const brigLabelLayer=L.layerGroup();
BJ.features.forEach(f=>{
  const {name,color,cx,cy}=f.properties;
  const short=name; // e.g. 第一大隊
  const icon=L.divIcon({
    className:'brig-label',
    html:`<div class="brig-label-inner" style="color:${color};border:1.5px solid ${color}88">${short}</div>`,
    iconAnchor:[28,10],iconSize:[56,20]
  });
  L.marker([cy,cx],{icon,interactive:false,zIndexOffset:600}).addTo(brigLabelLayer);
});
brigLabelLayer.addTo(map);

// bring brigade outlines above fills
brigGeo.bringToFront();

// ── Toggle buttons ────────────────────────────────────────────────────
let labelsOn=true,brigOn=true;
function toggleLabels(){
  labelsOn=!labelsOn;
  labelsOn?map.addLayer(labelLayer):map.removeLayer(labelLayer);
  document.getElementById('btn-label').classList.toggle('on',labelsOn);
}
function toggleBrigade(){
  brigOn=!brigOn;
  if(brigOn){map.addLayer(brigGeo);map.addLayer(brigLabelLayer);brigGeo.bringToFront();}
  else{map.removeLayer(brigGeo);map.removeLayer(brigLabelLayer);}
  document.getElementById('btn-brig').classList.toggle('on',brigOn);
}

// ── Panel ─────────────────────────────────────────────────────────────
function openPanel(name){
  currentDist=name; allMode=false;
  document.getElementById('panel').classList.remove('wide');
  const units=FD[name]||[];
  const brigades=[...new Set(units.map(u=>u.brigade))];
  const totPop=units.reduce((s,u)=>s+u.pop,0);
  const totStaff=effStaff(name);
  const avg=avgRatio(name);
  document.getElementById('pd-n').textContent=name;
  document.getElementById('pd-b').textContent=brigades.join(' ／ ');
  let html='';
  if(units.length){
    html+=`<div class="summ">
      <div class="srow"><span class="sk">轄區人口合計</span><span class="sv">${totPop>0?totPop.toLocaleString()+' 人':'—'}</span></div>
      <div class="srow"><span class="sk">本區投入人力</span><span class="sv">${fmtStaff(totStaff)} 人</span></div>
      <div class="srow"><span class="sk">平均服務人口比</span><span class="sv" style="color:${ratioText(avg)};font-weight:700">${avg>0?Math.round(avg).toLocaleString()+' 人/員':'—'}</span></div>
    </div>`;
    units.forEach(u=>{
      const bc=BC[u.brigade]||'#607d8b';
      const ur=uRatio(u);
      const rc=ratioText(ur);   // 文字用
      const rf=ratioColor(ur);  // 色塊用
      const fw=ur>0?Math.min(100,Math.round(ur/5500*100)):0;
      const cross=u.total>0&&u.total!==u.pop;   // 跨行政區
      html+=`<div class="ucard${OV[u.name]!==undefined?' uedit':''}">
        <div class="uname">${u.name}
          <span class="ubadge brig" style="background:${bc}22;color:${bc}">${u.brigade}</span>
          ${u.note?`<span class="ubadge" style="background:var(--note-bg);color:var(--note-fg)">${u.note}</span>`:''}
        </div>
        <div class="u3">
          <div>${editMode
            ?`<input class="sinput" type="number" min="0" max="999" value="${gs(u)}" data-unit="${u.name}"
                onchange="setStaff('${u.name}',this.value)" onfocus="lastEdited='${u.name}'">`
            :`<div class="val" style="color:var(--val-blue)">${gs(u)}</div>`}
            <div class="lbl">人員數${OV[u.name]!==undefined?' ✎':''}</div></div>
          <div><div class="val" style="color:var(--val-teal)">${u.total>0?(u.total/10000).toFixed(1)+'萬':'—'}</div><div class="lbl">服務人口</div></div>
          <div><div class="val" style="color:${rc}">${ur>0?ur.toLocaleString():'—'}</div><div class="lbl">人口比</div></div>
        </div>
        ${cross
          ?`<div class="xnote">本區 ${u.pop.toLocaleString()} 人（${u.villages} 里）｜ 全隊 ${u.total.toLocaleString()} 人</div>`
          :(u.villages?`<div class="xnote">轄 ${u.villages} 里</div>`:'')}
        ${ur>0?`<div class="bw"><div class="bl"><span>服務人口比</span><span style="color:${rc}">${ur.toLocaleString()} 人/員</span></div>
        <div class="bb"><div class="bf" style="width:${fw}%;background:${rf}"></div></div></div>`:''}
      </div>`;
    });
  }else{
    html='<div style="color:var(--empty);font-size:13px;text-align:center;padding:24px">此區無分隊資料</div>';
  }
  document.getElementById('pd-body').innerHTML=html;
  document.getElementById('panel').classList.add('open');
}

function closePanel(){
  currentDist=null; allMode=false;
  document.getElementById('panel').classList.remove('open','wide');
  if(activeLayer){distGeo.resetStyle(activeLayer);activeLayer=null;}
  document.getElementById('hint').classList.remove('hidden');
}

// ── Theme switching ───────────────────────────────────────────────────
function applyTheme(t){
  theme=(t==='light')?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  try{localStorage.setItem('fdmap-theme',theme);}catch(e){}

  const wanted=TILES[theme],other=TILES[theme==='dark'?'light':'dark'];
  if(map.hasLayer(other))map.removeLayer(other);
  if(!map.hasLayer(wanted))wanted.addTo(map);

  refreshAll();

  const b=document.getElementById('btn-theme');
  if(b)b.textContent=(theme==='dark')?'☀️ 淺色':'🌙 深色';
}
function toggleTheme(){applyTheme(theme==='dark'?'light':'dark');}

// ── 試算模式 ──────────────────────────────────────────────────────────
function refreshAll(){
  distGeo.eachLayer(l=>{
    distGeo.resetStyle(l);
    l.setTooltipContent(tipHTML(l.feature.properties.name));
  });
  if(activeLayer)activeLayer.setStyle({weight:3,color:cssv('--poly-active'),fillOpacity:+cssv('--fill-op-active')});
  if(brigOn)brigGeo.bringToFront();
  if(allMode)openAll(); else if(currentDist)openPanel(currentDist);
  renderBar();
  if(editMode&&lastEdited){
    const el=document.querySelector(`.sinput[data-unit="${lastEdited}"]`);
    if(el){el.focus();el.select();}
  }
}

function renderBar(){
  const bar=document.getElementById('ebar');
  const on=editMode||ovCount()>0;
  const was=bar.classList.contains('show');
  bar.classList.toggle('show',on);
  // 容器高度變了要讓 Leaflet 重新量，不然點擊座標與畫面會對不上
  if(was!==on)setTimeout(()=>map.invalidateSize({pan:false}),0);
  const n=ovCount();
  document.getElementById('eb-msg').innerHTML = n
    ? `已調整 <b>${n}</b> 隊　目前顯示的是假設值，<b>不是官方數字</b>`
    : '改左側「人員數」即時重算人口比與地圖顏色';
}

function setStaff(name,val){
  const n=parseInt(val,10);
  if(!isFinite(n)||n<0||n===ORIG_STAFF[name])delete OV[name];
  else OV[name]=Math.min(n,999);
  saveOV();
  refreshAll();
}

function resetStaff(){
  if(ovCount()&&!confirm('把所有調整過的人數還原成官方值？'))return;
  OV={};lastEdited=null;saveOV();refreshAll();
}

// ── 依大隊列出全部分隊（批次 key 人數用）────────────────────────────
let allMode=false;

function openAllList(){
  editMode=true;
  document.getElementById('btn-edit').classList.add('on');
  openAll();
  renderBar();
}

function openAll(){
  allMode=true; currentDist=null;
  if(activeLayer){distGeo.resetStyle(activeLayer);activeLayer=null;}
  const seen=new Set(), byB={};
  for(const d in FD)for(const u of FD[d]){
    if(seen.has(u.name))continue;
    seen.add(u.name);
    (byB[u.brigade]=byB[u.brigade]||[]).push({u:u,d:d});
  }
  let tot=0, html='<div class="ahdr"><span>分隊</span><span>服務人口</span><span>人員數</span><span>人口比</span></div>';
  const BORD={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  const brigs=Object.keys(byB).sort((a,b)=>(BORD[a[1]]||99)-(BORD[b[1]]||99)||a.localeCompare(b,'zh-Hant'));
  for(const b of brigs){
    const list=byB[b].sort((x,y)=>y.u.total-x.u.total);
    const st=list.reduce((s,x)=>s+gs(x.u),0);
    tot+=st;
    html+=`<div class="ghdr"><span class="gname" style="color:${BC[b]||'#607d8b'}">${b}</span>`
        + `<span class="gsum">${list.length} 隊 ｜ ${st} 人</span></div>`;
    for(const x of list){
      const u=x.u, r=uRatio(u);
      html+=`<div class="arow${OV[u.name]!==undefined?' uedit':''}">`
          + `<span class="an">${u.name}${u.note?`<small>${u.note}</small>`:''}</span>`
          + `<span class="ap">${u.total>0?(u.total/10000).toFixed(1)+'萬':'—'}</span>`
          + `<input class="sinput sm" type="number" min="0" max="999" value="${gs(u)}" data-unit="${u.name}"`
          + ` onchange="setStaff('${u.name}',this.value)" onfocus="lastEdited='${u.name}'">`
          + `<span class="ar" style="color:${ratioText(r)}">${r>0?r.toLocaleString():'—'}</span></div>`;
    }
  }
  document.getElementById('pd-n').textContent='全部分隊';
  document.getElementById('pd-b').textContent=`${seen.size} 隊 ｜ 人力合計 ${tot} 人`;
  document.getElementById('pd-body').innerHTML=html;
  const pn=document.getElementById('panel');
  pn.classList.add('open','wide');
  document.getElementById('hint').classList.add('hidden');
}

function fitAll(){
  map.invalidateSize({pan:false});
  map.fitBounds(distGeo.getBounds(),{padding:[8,8]});
}

function toggleEdit(){
  editMode=!editMode;
  document.getElementById('btn-edit').classList.toggle('on',editMode);
  if(editMode&&!currentDist)document.getElementById('hint').textContent='👆 點行政區，就能調整該區各分隊人數';
  refreshAll();
}

// 匯出成 data/staff.csv 可直接覆蓋的格式
function exportStaff(){
  const seen=new Set(),list=[];
  for(const d in FD)for(const u of FD[d]){
    if(seen.has(u.name))continue;
    seen.add(u.name);
    list.push([u.name,gs(u),u.brigade,u.note||'',u.total===0?d:'']);
  }
  list.sort((a,b)=>a[2]===b[2]?a[0].localeCompare(b[0],'zh-Hant'):a[2].localeCompare(b[2],'zh-Hant'));
  const esc=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  const csv='\ufeff'+[['分隊','人員數','大隊','備註','無里轄區時歸屬區'],...list]
    .map(r=>r.map(esc).join(',')).join('\n')+'\n';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='staff.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

// 使用者沒手動選過主題時，跟隨系統設定
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: light)');
  const onSys=e=>{
    let saved=null; try{saved=localStorage.getItem('fdmap-theme');}catch(err){}
    if(saved!=='light'&&saved!=='dark')applyTheme(e.matches?'light':'dark');
  };
  mq.addEventListener?mq.addEventListener('change',onSys):mq.addListener(onSys);
}

applyTheme(theme);
map.fitBounds(distGeo.getBounds(),{padding:[8,8]});
window.addEventListener('resize',()=>map.invalidateSize({pan:false}));
</script>
